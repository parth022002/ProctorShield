{% extends "layout.html" %}
{% block content %}
<div class="container" style="margin-top: 90px; margin-bottom: 50px; max-width: 800px; background: transparent !important; border: none !important; box-shadow: none !important;">
    <div class="glass-card" style="padding: 40px; border-radius: 20px;">
        <h2 style="font-weight: 700; color: #ffffff; margin-bottom: 10px;">Activate Quiz Settings</h2>
        <h5 style="color: #ff3b5c; font-weight: 600; margin-bottom: 30px;">Quiz: {{ quiz.title }}</h5>

        <form method="POST">
            <h5 style="color: #ffffff; font-weight: 600; margin-bottom: 15px;">Select Students to Assign</h5>
            
            {% if students %}
            <div style="max-height: 350px; overflow-y: auto; margin-bottom: 30px; padding-right: 10px;">
                {% for student in students %}
                <div class="d-flex align-items-center" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 15px; margin-bottom: 12px; transition: all 0.2s;">
                    <input type="checkbox" name="assigned_student_ids" value="{{ student.id }}" id="student_{{ student.id }}" 
                           {% if student in quiz.assigned_students %}checked{% endif %}
                           style="width: 20px; height: 20px; accent-color: #ff3b5c; margin-right: 15px;">
                    <label for="student_{{ student.id }}" style="margin: 0; color: #ffffff; cursor: pointer; font-weight: 500; display: inline-block;">
                        {{ student.user.name }} <span style="color: rgba(255, 255, 255, 0.5); font-size: 0.9rem; margin-left: 10px;">({{ student.user.email }})</span>
                    </label>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <div class="text-center" style="padding: 20px; color: rgba(255,255,255,0.6);">
                No registered students found.
            </div>
            {% endif %}

            <div class="d-flex justify-content-between align-items-center">
                <a class="btn btn-secondary" href="{{ url_for('teacher.activate_quiz_list') }}" style="border-radius: 10px; padding: 10px 20px;">Cancel</a>
                <div>
                    <button type="submit" name="action" value="deactivate" class="btn btn-warning" style="border-radius: 10px; padding: 10px 25px; font-weight: 600; margin-right: 10px; color: #ffffff;">Deactivate Quiz</button>
                    <button type="submit" name="action" value="activate" class="btn btn-danger" style="border-radius: 10px; padding: 10px 25px; font-weight: 600; background-color: #e43c5c;">Save & Activate</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
